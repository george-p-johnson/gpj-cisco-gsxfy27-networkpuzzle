<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Network Puzzle Remote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Network Puzzle Remote</h1>
    <div class="board-status-mini" id="boardStatus" title="Board status">
      <span class="board-status-mini-label">Boards</span>
      <span class="board-dot" data-board="1" title="Board 1"></span>
      <span class="board-dot board-dot-gap" data-board="2" title="Board 2"></span>
      <span class="board-dot" data-board="3" title="Board 3"></span>
      <span class="board-dot board-dot-gap" data-board="4" title="Board 4"></span>
      <span class="board-dot" data-board="5" title="Board 5"></span>
      <span class="board-dot" data-board="6" title="Board 6"></span>
    </div>
    <div class="status" id="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting&hellip;</span>
    </div>
  </header>

  <main>
    <section class="game-state" id="gameState">
      <span class="game-state-label">Game State</span>
      <span class="game-state-value" id="gameStateValue">&mdash;</span>
    </section>

    <section class="players">
      <button class="player-btn" data-player="1">
        <span class="label">Player 1</span>
        <span class="state">OFF</span>
      </button>
      <button class="player-btn" data-player="2">
        <span class="label">Player 2</span>
        <span class="state">OFF</span>
      </button>
      <button class="player-btn" data-player="3">
        <span class="label">Player 3</span>
        <span class="state">OFF</span>
      </button>
    </section>

    <p class="connection-warning" id="connectionWarning" hidden>
      Unplug all patch cords from the previous game before starting a new one.
      <span class="connection-warning-detail" id="connectionWarningDetail"></span>
    </p>

    <section class="primary-actions">
      <button class="pulse-btn start" data-action="start_game">Start Game</button>
      <button class="pulse-btn reset" data-action="reset_game">Reset Game</button>
    </section>

    <section class="answer-key-section">
      <button class="link-btn" id="answerKeyToggle" type="button" aria-expanded="false">Show Answer Key</button>
      <div class="answer-key" id="answerKey" hidden></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
